<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut-Lite — Видеоредактор</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════════
         Верхняя панель: название + действия проекта
    ═══════════════════════════════════════════════════════════════════ -->
    <header class="toolbar">
        <h1 class="logo">CapCut-Lite</h1>
        <div class="toolbar-actions">
            <input type="text" id="project-name" placeholder="Имя проекта" value="Мой проект">
            <button id="btn-save" title="Сохранить проект">💾 Сохранить</button>
            <button id="btn-load" title="Загрузить проект">📂 Загрузить</button>
            <button id="btn-export" title="Экспорт видео (ffmpeg)">🎬 Экспорт</button>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════════
         Основная область: видеоплеер + панель свойств
    ═══════════════════════════════════════════════════════════════════ -->
    <main class="workspace">
        <!-- Левая часть: видеоплеер -->
        <section class="player-section">
            <div class="video-container">
                <!-- Заглушка пока видео не загружено -->
                <div id="video-placeholder" class="placeholder">
                    <p>🎥 Перетащите видео сюда или нажмите кнопку ниже</p>
                    <input type="file" id="video-input" accept="video/*" hidden>
                    <button id="btn-load-video">Загрузить видео</button>
                </div>
                <video id="video-player" controls hidden>
                    Ваш браузер не поддерживает видео.
                </video>
            </div>

            <!-- Управление воспроизведением -->
            <div class="player-controls">
                <button id="btn-play" disabled>▶ Играть</button>
                <span id="time-display">0:00.0 / 0:00.0</span>
                <label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
                    🔊
                </label>
            </div>
        </section>

        <!-- Правая панель: свойства выбранного маркера -->
        <aside class="properties-panel" id="properties-panel">
            <h3>Свойства маркера</h3>
            <div id="no-marker-selected" class="hint">
                <p>Выберите маркер на таймлайне или создайте новый</p>
            </div>

            <div id="marker-properties" hidden>
                <div class="prop-group">
                    <label>Текст реплики:</label>
                    <textarea id="marker-text" rows="3" placeholder="Введите текст для озвучки..."></textarea>
                </div>

                <div class="prop-group">
                    <label>Начало (сек):</label>
                    <input type="number" id="marker-start" step="0.1" min="0">
                </div>

                <div class="prop-group">
                    <label>Длительность (сек):</label>
                    <input type="number" id="marker-duration" step="0.1" min="0.1" value="2">
                </div>

                <div class="prop-group">
                    <label>Язык:</label>
                    <select id="marker-language">
                        <option value="ru-RU">Русский</option>
                        <option value="en-US">English</option>
                        <option value="uz-UZ">O'zbek</option>
                    </select>
                </div>

                <div class="prop-group tts-section">
                    <button id="btn-generate-tts" class="btn-primary">🎙 Сгенерировать озвучку (3 варианта)</button>
                    <div id="tts-status" class="status-text"></div>
                </div>

                <!-- Варианты озвучки -->
                <div id="tts-variants" class="variants-list" hidden>
                    <h4>Варианты озвучки:</h4>
                    <div id="variants-container"></div>
                </div>

                <!-- Ручная загрузка аудио -->
                <div class="prop-group">
                    <label>Или загрузить аудио вручную:</label>
                    <input type="file" id="marker-audio-input" accept="audio/*">
                </div>

                <!-- Текущее прикреплённое аудио -->
                <div id="marker-audio-info" class="audio-info" hidden>
                    <span>🔊 Прикреплено:</span>
                    <span id="attached-audio-name"></span>
                    <button id="btn-play-attached" class="btn-small">▶</button>
                    <button id="btn-remove-audio" class="btn-small btn-danger">✕</button>
                </div>

                <div class="prop-group">
                    <button id="btn-delete-marker" class="btn-danger">🗑 Удалить маркер</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- ═══════════════════════════════════════════════════════════════════
         Таймлайн (временная шкала)
    ═══════════════════════════════════════════════════════════════════ -->
    <section class="timeline-section">
        <div class="timeline-toolbar">
            <button id="btn-add-marker" disabled>＋ Добавить маркер</button>
            <button id="btn-zoom-in">🔍+</button>
            <button id="btn-zoom-out">🔍−</button>
            <span id="zoom-level">Масштаб: 100%</span>
        </div>

        <div class="timeline-wrapper" id="timeline-wrapper">
            <!-- Шкала времени (секунды) -->
            <div class="time-ruler" id="time-ruler"></div>

            <!-- Полоса воспроизведения (playhead) -->
            <div class="playhead" id="playhead"></div>

            <!-- Дорожки маркеров -->
            <div class="tracks-container" id="tracks-container">
                <div class="track" id="track-markers" data-track="markers">
                    <div class="track-label">Реплики</div>
                    <div class="track-content" id="track-content-markers"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         Модальные окна
    ═══════════════════════════════════════════════════════════════════ -->
    <!-- Модал загрузки проекта -->
    <div id="modal-load" class="modal" hidden>
        <div class="modal-content">
            <h3>Загрузить проект</h3>
            <div id="projects-list" class="projects-list">
                <p class="hint">Загрузка...</p>
            </div>
            <button class="btn-close-modal" data-modal="modal-load">Закрыть</button>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="notifications" class="notifications"></div>

    <!-- ═══════════════════════════════════════════════════════════════════
         JavaScript модули (без сборки — обычные скрипты)
    ═══════════════════════════════════════════════════════════════════ -->
    <script src="/static/js/audio.js"></script>
    <script src="/static/js/timeline.js"></script>
    <script src="/static/js/tts.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
