<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JarCut — Авто-дубляж</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Segoe UI',system-ui,sans-serif; background:#0d0d14; color:#e8eaed;
    min-height:100vh; padding:24px 16px 60px;
}
.wrap { max-width:820px; margin:0 auto; }

h1 { font-size:22px; font-weight:800; margin-bottom:4px;
     background:linear-gradient(90deg,#8b5cf6,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub { font-size:13px; color:#8b8f9a; margin-bottom:20px; }

/* ── Drop zone ── */
.drop {
    border:2px dashed #2f3340; border-radius:14px; padding:44px 20px; text-align:center;
    cursor:pointer; transition:.2s; background:#14141f;
}
.drop:hover, .drop.over { border-color:#8b5cf6; background:#191926; }
.drop .ic { font-size:44px; margin-bottom:10px; }
.drop .t1 { font-size:15px; font-weight:600; margin-bottom:4px; }
.drop .t2 { font-size:12px; color:#6b7080; }

/* ── Video ── */
video { width:100%; border-radius:12px; background:#000; display:block; }

/* ── Cards ── */
.card { background:#14141f; border:1px solid #23252f; border-radius:12px; padding:16px; margin-top:14px; }

/* ── Controls row ── */
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
label.lbl { font-size:12px; color:#8b8f9a; }

select {
    background:#1c1c2a; border:1px solid #2f3340; color:#e8eaed; padding:10px 12px;
    border-radius:9px; font-size:14px; font-family:inherit; flex:1; min-width:150px; cursor:pointer;
}
select:focus { outline:none; border-color:#8b5cf6; }

/* ── Buttons ── */
.btn {
    border:none; border-radius:10px; font-family:inherit; font-weight:600; cursor:pointer;
    transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-big { width:100%; padding:16px; font-size:16px; margin-top:12px; }
.btn-p { background:linear-gradient(90deg,#8b5cf6,#7c3aed); color:#fff; }
.btn-p:hover:not(:disabled) { filter:brightness(1.15); }
.btn-g { background:#10b981; color:#fff; }
.btn-g:hover:not(:disabled) { background:#059669; }
.btn-s { background:#22232e; color:#b9bdc7; padding:7px 12px; font-size:12px; border:1px solid #2f3340; }
.btn-s:hover { border-color:#8b5cf6; color:#fff; }

/* ── Slider ── */
.slider-row { display:flex; align-items:center; gap:12px; margin-top:14px; }
input[type=range] { flex:1; accent-color:#8b5cf6; height:6px; }
.pct { font-size:13px; color:#b9bdc7; min-width:42px; text-align:right; font-variant-numeric:tabular-nums; }

/* ── Status ── */
.status { margin-top:14px; padding:14px 16px; border-radius:10px; font-size:14px; display:flex; align-items:center; gap:10px; }
.status.work { background:#1e1b3a; color:#c4b5fd; }
.status.ok   { background:#0d2e22; color:#6ee7b7; }
.status.err  { background:#33161a; color:#fca5a5; }
.spin { width:16px; height:16px; border:2px solid #4c4a6a; border-top-color:#a78bfa; border-radius:50%; animation:sp .6s linear infinite; flex-shrink:0; }
@keyframes sp { to { transform:rotate(360deg) } }

.bar { height:5px; background:#1c1c2a; border-radius:3px; overflow:hidden; margin-top:12px; }
.bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#8b5cf6,#10b981); transition:width .3s; }

/* ── Phrases ── */
.head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.head h2 { font-size:14px; font-weight:600; }
.count { font-size:12px; color:#6b7080; }

.ph { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #1e2029; }
.ph:last-child { border-bottom:none; }
.ph-t { font-size:11px; color:#6b7080; font-variant-numeric:tabular-nums; padding-top:9px; min-width:38px; cursor:pointer; }
.ph-t:hover { color:#a78bfa; }
.ph-b { flex:1; min-width:0; }
.ph-o { font-size:11px; color:#5f6470; margin-bottom:5px; }
.ph textarea {
    width:100%; background:#1a1a26; border:1px solid #282a36; color:#e8eaed; padding:8px 10px;
    border-radius:8px; font-size:14px; font-family:inherit; resize:vertical; min-height:38px; line-height:1.4;
}
.ph textarea:focus { outline:none; border-color:#8b5cf6; }
.ph-r { display:flex; flex-direction:column; gap:5px; align-items:center; padding-top:6px; }
.dot { font-size:15px; }

audio { width:100%; height:30px; margin-top:6px; }

a.dl { color:#6ee7b7; font-weight:600; text-decoration:none; }
a.dl:hover { text-decoration:underline; }

/* ── Toast ── */
.toasts { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:99; }
.toast { padding:11px 18px; border-radius:9px; font-size:13px; animation:up .25s; box-shadow:0 8px 24px rgba(0,0,0,.5); }
.toast.i { background:#312e81; color:#ddd6fe; }
.toast.o { background:#065f46; color:#a7f3d0; }
.toast.e { background:#7f1d1d; color:#fecaca; }
@keyframes up { from { transform:translateY(16px); opacity:0 } }
</style>
</head>
<body>
<div class="wrap">

    <h1>JarCut</h1>
    <div class="sub">Поставь видео — получи профессиональный дубляж</div>

    <!-- Загрузка -->
    <div class="drop" id="drop">
        <div class="ic">🎬</div>
        <div class="t1">Перетащи видео сюда</div>
        <div class="t2">или нажми, чтобы выбрать файл</div>
        <input type="file" id="file" accept="video/*,audio/*" hidden>
    </div>

    <!-- Видео -->
    <video id="vid" controls hidden></video>

    <!-- Настройки дубляжа -->
    <div class="card" id="setup" hidden>
        <div class="row">
            <label class="lbl">Язык</label>
            <select id="lang">
                <option value="uz">🇺🇿 Узбекский</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="en">🇬🇧 English</option>
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="kk">🇰🇿 Қазақ</option>
                <option value="ky">🇰🇬 Кыргыз</option>
                <option value="tg">🇹🇯 Тоҷикӣ</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>

            <label class="lbl">Голос</label>
            <select id="voice">
                <option value="Charon">Мужской — глубокий</option>
                <option value="Puck">Мужской — обычный</option>
                <option value="Fenrir">Мужской — сильный</option>
                <option value="Orus">Мужской — спокойный</option>
                <option value="Kore">Женский — мягкий</option>
                <option value="Aoede">Женский — живой</option>
                <option value="Leda">Женский — спокойный</option>
                <option value="Autonoe">Женский — низкий</option>
            </select>
        </div>

        <button class="btn btn-p btn-big" id="go">🎙 Дублировать видео</button>

        <div class="bar" id="bar" hidden><i id="fill"></i></div>
        <div class="status work" id="st" hidden><span class="spin"></span><span id="st-txt"></span></div>
    </div>

    <!-- Реплики -->
    <div class="card" id="phrases" hidden>
        <div class="head">
            <h2>Реплики дубляжа</h2>
            <span class="count" id="cnt"></span>
        </div>
        <div id="list"></div>
        <button class="btn btn-s" id="revoice" style="margin-top:12px">🔄 Переозвучить изменённые</button>
    </div>

    <!-- Финал -->
    <div class="card" id="final" hidden>
        <div class="slider-row">
            <label class="lbl">Оригинальный звук</label>
            <input type="range" id="vol" min="0" max="100" value="15">
            <span class="pct" id="volv">15%</span>
        </div>
        <button class="btn btn-g btn-big" id="save">⬇ Скачать готовое видео</button>
        <div class="status" id="st2" hidden></div>
    </div>

</div>
<div class="toasts" id="toasts"></div>

<script>
// ═══ Состояние ═══
const S = { file:null, dur:0, segs:[], playing:false, vol:0.15 };

const $ = id => document.getElementById(id);
const vid = $('vid');

const fmt = s => !s||isNaN(s) ? '0:00' : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toast(kind, msg) {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity=0; setTimeout(()=>el.remove(),300); }, 3600);
}

function setStatus(kind, text, spinning) {
    const box = $('st');
    box.hidden = false;
    box.className = 'status ' + kind;
    box.innerHTML = (spinning ? '<span class="spin"></span>' : '') + `<span>${text}</span>`;
}

// ═══ 1. Загрузка видео ═══
$('drop').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && upload(e.target.files[0]);

document.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
document.addEventListener('dragleave', () => $('drop').classList.remove('over'));
document.addEventListener('drop', e => {
    e.preventDefault(); $('drop').classList.remove('over');
    if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});

async function upload(f) {
    toast('i', 'Загружаю видео…');
    const fd = new FormData(); fd.append('file', f);
    try {
        const r = await fetch('/api/upload', { method:'POST', body:fd });
        const d = await r.json();
        if (!d.ok) throw new Error('не удалось загрузить');

        S.file = d.filename;
        vid.src = d.url;
        vid.hidden = false;
        vid.volume = S.vol;
        $('drop').hidden = true;
        $('setup').hidden = false;
        vid.onloadedmetadata = () => { S.dur = vid.duration; };
        toast('o', 'Видео загружено');
    } catch (err) { toast('e', err.message); }
}

// ═══ 2. Дубляж: перевод + озвучка одной кнопкой ═══
$('go').onclick = dub;

async function dub() {
    if (!S.file) return;
    const lang  = $('lang').value;
    const voice = $('voice').value;

    $('go').disabled = true;
    $('bar').hidden = false;
    $('fill').style.width = '10%';
    setStatus('work', 'Слушаю видео и перевожу… (это занимает 30–90 сек)', true);

    // — Шаг 1: распознать + перевести
    try {
        const r = await fetch('/api/translate', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ filename:S.file, lang })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || `ошибка ${r.status}`);

        S.segs = (d.segments || []).map((s,i) => ({
            id:'s'+i, start:+s.start||0, end:+s.end||0,
            original:s.original||'', text:s.translated||'',
            audio:null, url:null, state:'wait'
        }));

        if (!S.segs.length) throw new Error('в видео не найдено речи');

        $('fill').style.width = '35%';
        renderPhrases();
        $('phrases').hidden = false;
        toast('o', `Переведено реплик: ${S.segs.length}`);
    } catch (err) {
        setStatus('err', 'Перевод не удался: ' + err.message, false);
        $('go').disabled = false;
        return;
    }

    // — Шаг 2: озвучить всё
    await voiceAll(voice, 35);

    $('go').disabled = false;
    $('go').textContent = '🔄 Дублировать заново';
    $('final').hidden = false;
}

// Озвучка списка реплик (по одной, с прогрессом)
async function voiceAll(voice, baseProgress) {
    setStatus('work', 'Озвучиваю реплики…', true);

    const todo = S.segs.filter(s => s.text.trim());
    let done = 0, bad = 0;

    for (const seg of todo) {
        seg.state = 'work';
        paintPhrase(seg);
        try {
            const r = await fetch('/api/voice', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ segments:[{ id:seg.id, text:seg.text }], voice })
            });
            const d = await r.json();
            const res = (d.results || [])[0] || {};
            if (res.ok) { seg.url = res.url; seg.audio = res.filename; seg.state = 'ok'; loadBuffer(seg); }
            else { seg.state = 'err'; bad++; }
        } catch { seg.state = 'err'; bad++; }

        done++;
        paintPhrase(seg);
        $('fill').style.width = (baseProgress + (100-baseProgress) * done/todo.length) + '%';
    }

    if (bad === 0) setStatus('ok', `Дубляж готов — ${done} реплик озвучено`, false);
    else setStatus(bad === done ? 'err' : 'ok', `Озвучено ${done-bad} из ${done} (${bad} с ошибкой)`, false);

    renderPhrases();
    setTimeout(() => { $('bar').hidden = true; $('fill').style.width='0'; }, 1500);
}

// Переозвучить только изменённые/неудачные
$('revoice').onclick = async () => {
    const pending = S.segs.filter(s => s.state !== 'ok' && s.text.trim());
    if (!pending.length) { toast('i','Нечего переозвучивать'); return; }
    $('bar').hidden = false;
    await voiceAll($('voice').value, 0);
};

// ═══ Список реплик ═══
function renderPhrases() {
    $('cnt').textContent = `${S.segs.filter(s=>s.state==='ok').length} / ${S.segs.length} озвучено`;
    $('list').innerHTML = S.segs.map(s => `
        <div class="ph" id="ph-${s.id}">
            <div class="ph-t" onclick="jump(${s.start})">${fmt(s.start)}</div>
            <div class="ph-b">
                ${s.original ? `<div class="ph-o">${esc(s.original)}</div>` : ''}
                <textarea rows="1" oninput="editPhrase('${s.id}',this.value)">${esc(s.text)}</textarea>
                ${s.url ? `<audio controls src="${s.url}"></audio>` : ''}
            </div>
            <div class="ph-r">
                <span class="dot" id="dot-${s.id}">${dotFor(s.state)}</span>
                <button class="btn btn-s" onclick="revoiceOne('${s.id}')">🎙</button>
            </div>
        </div>`).join('');
}

const dotFor = st => st==='ok' ? '✅' : st==='err' ? '❌' : st==='work' ? '⏳' : '⚪';

function paintPhrase(seg) {
    const dot = $('dot-'+seg.id);
    if (dot) dot.textContent = dotFor(seg.state);
    $('cnt').textContent = `${S.segs.filter(s=>s.state==='ok').length} / ${S.segs.length} озвучено`;
}

function editPhrase(id, val) {
    const s = S.segs.find(x => x.id === id);
    if (s && s.text !== val) { s.text = val; s.state = 'wait'; paintPhrase(s); }
}

async function revoiceOne(id) {
    const seg = S.segs.find(s => s.id === id);
    if (!seg || !seg.text.trim()) return;
    seg.state = 'work'; paintPhrase(seg);
    try {
        const r = await fetch('/api/voice', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ segments:[{ id:seg.id, text:seg.text }], voice:$('voice').value })
        });
        const res = ((await r.json()).results || [])[0] || {};
        if (res.ok) { seg.url = res.url; seg.audio = res.filename; seg.state='ok'; loadBuffer(seg); renderPhrases(); }
        else { seg.state='err'; paintPhrase(seg); toast('e', res.error || 'ошибка озвучки'); }
    } catch (e) { seg.state='err'; paintPhrase(seg); toast('e', e.message); }
}

function jump(t) { vid.currentTime = t; vid.play(); }

// ═══ Синхронное воспроизведение дубляжа с видео ═══
let ctx = null;
const buffers = {}, playing = {};

const audioCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
};

async function loadBuffer(seg) {
    try {
        const c = audioCtx();
        const buf = await c.decodeAudioData(await (await fetch(seg.url)).arrayBuffer());
        buffers[seg.id] = { buf, start: seg.start };
    } catch (e) { console.warn('decode fail', e); }
}

vid.addEventListener('play',  () => { S.playing = true;  audioCtx(); });
vid.addEventListener('pause', () => { S.playing = false; stopAll(); });
vid.addEventListener('seeking', stopAll);
vid.addEventListener('timeupdate', () => {
    if (!S.playing) return;
    const t = vid.currentTime;
    for (const s of S.segs) {
        const info = buffers[s.id];
        if (!info) continue;
        const inside = t >= info.start && t < info.start + info.buf.duration;
        if (inside && !playing[s.id]) start(s.id, t - info.start);
        else if (!inside && playing[s.id]) stop(s.id);
    }
});

function start(id, offset) {
    const c = audioCtx();
    const src = c.createBufferSource();
    src.buffer = buffers[id].buf;
    src.connect(c.destination);
    src.start(0, Math.max(0, offset));
    playing[id] = src;
    src.onended = () => delete playing[id];
}
function stop(id) { try { playing[id]?.stop(); } catch {} delete playing[id]; }
function stopAll() { Object.keys(playing).forEach(stop); }

// ═══ Громкость оригинала ═══
$('vol').oninput = e => {
    S.vol = e.target.value / 100;
    vid.volume = S.vol;
    $('volv').textContent = e.target.value + '%';
};

// ═══ Экспорт ═══
$('save').onclick = async () => {
    const ready = S.segs.filter(s => s.audio);
    if (!ready.length) { toast('e','Сначала озвучь реплики'); return; }

    const box = $('st2');
    box.hidden = false;
    box.className = 'status work';
    box.innerHTML = '<span class="spin"></span><span>Собираю видео с дубляжом…</span>';
    $('save').disabled = true;

    try {
        const r = await fetch('/api/export', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                video: S.file,
                segments: ready.map(s => ({ audio:s.audio, start:s.start })),
                originalVolume: S.vol
            })
        });
        const d = await r.json();
        if (d.ok) {
            box.className = 'status ok';
            box.innerHTML = `<span>Готово!</span> <a class="dl" href="${d.url}" download>Скачать видео</a>`;
            toast('o','Дубляж собран');
        } else {
            box.className = 'status err';
            box.textContent = d.error;
            toast('e','Ошибка сборки');
        }
    } catch (e) {
        box.className = 'status err';
        box.textContent = e.message;
    } finally { $('save').disabled = false; }
};
</script>
</body>
</html>
